<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bidisha Dash | Portfolio</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        rel="stylesheet"
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet"
    />

    <style>
        :root {

            /* MAIN BACKGROUND */
            --bg-cream: #F7F6F2;

            /* DARK FOREST SIDEBAR */
            --sidebar-dark: #0E2A1F;
            --sidebar-dark-2: #123524;
            --sidebar-highlight: #1B4D36;

            /* PRIMARY ACCENT */
            --primary-green: #73946B;

            /* TEXT */
            --text-dark: #171717;
            --text-light: #6B6B6B;

            /* BORDERS */
            --border-color: #E2E5DA;

            /* SIDEBAR TEXT */
            --sidebar-text: rgba(255,255,255,0.72);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--text-dark);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        h1,
        h2,
        h3,
        .font-serif {
            font-family: 'Playfair Display', serif;
        }

        /* SIDEBAR */

        .sidebar {

            width: 250px;

            position: fixed;
            top: 0;
            left: 0;

            height: 100vh;

            display: flex;
            flex-direction: column;

            padding: 3.5rem 1.3rem;

            z-index: 100;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(27,77,54,0.35),
                    transparent 35%
                ),
                linear-gradient(
                    180deg,
                    var(--sidebar-dark),
                    var(--sidebar-dark-2)
                );

            border-right: 1px solid rgba(255,255,255,0.04);

            box-shadow:
                8px 0 30px rgba(0,0,0,0.08);
        }

        .sidebar::before {

            content: "";

            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(115,148,107,0.12),
                    transparent 40%
                );

            pointer-events: none;
        }

        /* SIDEBAR NAVIGATION */

        .nav-link {

            display: flex;
            align-items: center;
            gap: 14px;

            padding: 14px 18px;

            border-radius: 16px;

            color: var(--sidebar-text);

            font-weight: 500;
            font-size: 0.96rem;

            margin-bottom: 8px;

            transition: all 0.3s ease;
        }

        .nav-link i {
            width: 18px;
        }

        .nav-link:hover {

            background: rgba(255,255,255,0.06);

            color: white;

            transform: translateX(4px);
        }

        .nav-link.active {

            background:
                linear-gradient(
                    90deg,
                    rgba(115,148,107,0.35),
                    rgba(255,255,255,0.05)
                );

            color: white;

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.05),
                0 4px 20px rgba(0,0,0,0.15);

            backdrop-filter: blur(8px);
        }

        /* MAIN CONTENT */

        .main-content {
            margin-left: 250px;
            position: relative;
        }

        .content-wrapper {

            position: relative;

            z-index: 10;

            max-width: 1450px;

            margin: 0 auto;

            padding: 0 6rem;
        }

        /* BOTANICAL BLOBS */

        .botanical-top {

            position: absolute;

            top: 0;
            right: 0;

            width: 450px;

            opacity: 0.08;

            filter: blur(2px);

            pointer-events: none;

            z-index: 1;
        }

        .botanical-bottom {

            position: fixed;

            bottom: -20px;
            left: 240px;

            width: 300px;

            opacity: 0.06;

            filter: blur(2px);

            pointer-events: none;

            z-index: 1;
        }

        /* HERO SECTION */

        section {
            padding-top: 100px;
            padding-bottom: 100px;
        }

        /* PROFILE */

        .profile-container {

            position: relative;

            width: 520px;
            height: 520px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-img {

            width: 390px;
            height: 390px;

            border-radius: 50%;

            object-fit: cover;

            border: 16px solid rgba(255,255,255,0.95);

            box-shadow: 0 20px 50px rgba(0,0,0,0.05);

            position: relative;

            z-index: 5;
        }

        .leaf-frame-svg {

            position: absolute;

            width: 120%;
            height: 120%;

            fill: #DDE4D3;

            opacity: 0.4;

            z-index: 1;
        }

        /* BUTTONS */

        .btn-green,
        .btn-white {

            padding: 18px 42px;

            border-radius: 18px;

            font-weight: 600;

            font-size: 1rem;

            transition: all 0.3s ease;
        }

        .btn-green {

            background: var(--primary-green);

            color: white;
        }

        .btn-green:hover {

            transform: translateY(-3px);

            filter: brightness(1.05);
        }

        .btn-white {

            background: white;

            border: 1px solid var(--border-color);

            color: var(--text-dark);
        }

        .btn-white:hover {
            transform: translateY(-3px);
        }

        /* CARDS */

        .card-modern {

            background: rgba(255,255,255,0.8);

            backdrop-filter: blur(10px);

            border: 1px solid rgba(255,255,255,0.7);

            border-radius: 28px;

            padding: 2.5rem;

            text-align: center;

            box-shadow: 0 4px 20px rgba(0,0,0,0.03);

            transition: all 0.35s ease;
        }

        .card-modern:hover {

            transform: translateY(-8px);

            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        }

        .card-modern i {

            color: var(--primary-green);

            font-size: 1.6rem;

            margin-bottom: 1rem;

            display: block;
        }

        .card-modern p {

            font-size: 0.76rem;

            font-weight: 700;

            color: #888;

            text-transform: uppercase;

            letter-spacing: 1px;
        }

        /* STATS */

        .stats-grid {

            background-color: #EEF1E7;

            border-radius: 28px;

            padding: 3rem 2rem;

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            margin-top: 5rem;

            backdrop-filter: blur(10px);

            border: 1px solid rgba(255,255,255,0.6);
        }

        .stat-line {

            border-right: 1px solid #D8DCCF;

            text-align: center;
        }

        .stat-line:last-child {
            border-right: none;
        }

        /* RESPONSIVE */

        @media (max-width: 1024px) {

            .sidebar {
                display: none;
            }

            .main-content {
                margin-left: 0;
            }

            .content-wrapper {
                padding: 0 2rem;
            }

            .profile-container {
                width: 380px;
                height: 380px;
            }

            .profile-img {
                width: 300px;
                height: 300px;
            }

            h1 {
                font-size: 72px !important;
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="mb-14 px-2 relative z-10">

            <div class="text-[#8EB486] text-3xl mb-7">
                <i class="fa-solid fa-leaf"></i>
            </div>

            <h2 class="text-[2rem] font-serif text-white leading-tight tracking-tight">
                Bidisha Dash
            </h2>

            <p class="text-[10px] font-semibold text-white/50 uppercase tracking-[0.22em] mt-3 leading-5">
                Aspiring Ag-Tech Researcher
            </p>
        </div>

        <nav class="flex-grow relative z-10">

            <a href="#home" class="nav-link active">
                <i class="fa-solid fa-house"></i> Home
            </a>

            <a href="#about" class="nav-link">
                <i class="fa-solid fa-user"></i> About Me
            </a>

            <a href="#education" class="nav-link">
                <i class="fa-solid fa-graduation-cap"></i> Education
            </a>

            <a href="#skills" class="nav-link">
                <i class="fa-solid fa-seedling"></i> Skills
            </a>

            <a href="#projects" class="nav-link">
                <i class="fa-solid fa-folder-open"></i> Projects
            </a>

            <a href="#publications" class="nav-link">
                <i class="fa-solid fa-book"></i> Publications
            </a>

            <a href="#certifications" class="nav-link">
                <i class="fa-solid fa-award"></i> Certifications
            </a>

            <a href="#contact" class="nav-link">
                <i class="fa-solid fa-paper-plane"></i> Contact
            </a>
        </nav>

        <!-- SOCIALS -->

        <div class="mt-auto flex gap-5 px-4 pt-8 border-t border-white/10 relative z-10">

            <a href="#" class="text-white/55 hover:text-white transition">
                <i class="fa-brands fa-linkedin-in text-lg"></i>
            </a>

            <a href="#" class="text-white/55 hover:text-white transition">
                <i class="fa-brands fa-github text-lg"></i>
            </a>

            <a href="#" class="text-white/55 hover:text-white transition">
                <i class="fa-solid fa-envelope text-lg"></i>
            </a>

        </div>

    </aside>

    <!-- MAIN CONTENT -->

    <main class="main-content">

        <!-- TOP BLOB -->

        <div class="botanical-top">

            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">

                <path
                    fill="#6D8B5A"
                    d="M38.1,-63.4C49.5,-57.1,59,-47.1,66.1,-35.3C73.1,-23.5,77.7,-9.9,76.6,3.5C75.4,16.9,68.5,30.1,59.3,40.8C50.1,51.5,38.6,59.7,25.8,64.9C13,70.1,-0.8,72.4,-15.5,70.8C-30.3,69.2,-46,63.7,-57.8,53.4C-69.6,43.1,-77.4,27.9,-79.8,11.9C-82.2,-4,-79.2,-20.7,-71.4,-34.5C-63.6,-48.3,-51,-59.1,-37.5,-64.5C-24,-69.8,-9.6,-69.6,2.4,-64.1C14.3,-58.5,26.7,-69.7,38.1,-63.4Z"
                    transform="translate(100 100)"
                />

            </svg>

        </div>

        <div class="content-wrapper">

            <!-- HOME -->

            <section
                id="home"
                class="min-h-screen flex items-center"
            >

                <div class="flex flex-col lg:flex-row items-center justify-between gap-16 w-full">

                    <!-- LEFT -->

                    <div class="flex-1 text-center lg:text-left">

                        <p class="text-[#73946B] font-semibold text-[28px] mb-6">
                            Hello, I'm
                        </p>

                        <h1 class="font-serif text-[110px] leading-[0.9] tracking-[-4px] text-[#171717] mb-8">
                            Bidisha <br />
                            Dash
                        </h1>

                        <p class="text-[28px] leading-[1.7] text-[#6B6B6B] font-normal max-w-[680px] mb-12">
                            Passionate about sustainable agriculture,
                            data-driven solutions and rural development.
                        </p>

                        <div class="flex gap-5 justify-center lg:justify-start">

                            <button class="btn-green">
                                View My Work
                            </button>

                            <button class="btn-white">
                                Download CV
                            </button>

                        </div>

                    </div>

                    <!-- RIGHT -->

                    <div class="profile-container">

                        <svg class="leaf-frame-svg" viewBox="0 0 200 200">

                            <path
                                d="M44.7,-76.4C58.8,-69.2,71.8,-59.1,79.6,-45.8C87.4,-32.6,90,-16.3,88.5,-0.9C86.9,14.5,81.2,29,72.4,41.9C63.6,54.7,51.7,65.9,38,72.6C24.3,79.3,8.7,81.6,-6.3,79.3C-21.3,77,-35.7,70.1,-48.4,60.8C-61.1,51.5,-72.1,39.9,-77.8,26.2C-83.5,12.5,-83.8,-3.3,-79.9,-17.8C-76,-32.3,-67.9,-45.5,-56.3,-53.8C-44.7,-62.1,-29.6,-65.4,-15.1,-71.4C-0.6,-77.4,14.7,-86.1,30.6,-83.7C46.5,-81.3,63,-67.7,44.7,-76.4Z"
                                transform="translate(100 100)"
                            />

                        </svg>

                        <img
                            src="profile.jpg"
                            alt="Bidisha Dash"
                            class="profile-img"
                        />

                    </div>

                </div>

            </section>

        </div>

    </main>

</body>
</html>
