<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bidisha Dash | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-cream: #F8F7F2;
            /* DARK PREMIUM SIDEBAR COLORS - Matched to Reference */
            --sidebar-dark: #0E2A1F;
            --sidebar-dark-2: #123524;
            --primary-green: #6D8B5A;
            --text-dark: #1F1F1F;
            --border-color: #E2E5DA;
        }

        body { 
            background-color: var(--bg-cream); 
            color: var(--text-dark); 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden;
        }

        h1, h2, h3, .font-serif {
            font-family: 'Playfair Display', serif;
        }

        /* Sidebar - Updated to Dark Forest Green Reference */
        .sidebar {
            width: 260px; 
            background: linear-gradient(180deg, var(--sidebar-dark), var(--sidebar-dark-2));
            position: fixed; 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            padding: 3.5rem 1.3rem; 
            z-index: 50; 
            box-shadow: 8px 0 30px rgba(0,0,0,0.1);
        }

        .nav-link {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            border-radius: 12px; color: rgba(255,255,255,0.7); font-weight: 500; font-size: 0.95rem;
            transition: all 0.3s ease; margin-bottom: 4px;
        }

        .nav-link:hover { background-color: rgba(255,255,255,0.05); color: #fff; transform: translateX(5px); }
        
        /* Active Navigation - Premium Glassy Effect */
        .nav-link.active { 
            font-weight: 700; 
            background: linear-gradient(90deg, rgba(109,139,90,0.3), rgba(255,255,255,0.05));
            color: #fff;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* Main Content */
        .main-content { margin-left: 260px; position: relative; }

        /* Botanical Decorations kept same per request */
        .botanical-top { position: absolute; top: 0; right: 0; width: 400px; opacity: 0.15; pointer-events: none; z-index: 1; }
        .botanical-bottom { position: fixed; bottom: -20px; left: 240px; width: 300px; opacity: 0.1; pointer-events: none; z-index: 1; }

        .content-wrapper { position: relative; z-index: 10; max-width: 1100px; margin: 0 auto; padding: 0 4rem; }

        /* Profile Area kept same */
        .profile-container { position: relative; width: 380px; height: 380px; }
        .profile-img
